# Build the plugin DLL and publish it as a GitHub Release.
#
# Runs when a tag like v0.69.0 is pushed (or manually from the Actions tab once this file is on
# the default branch). The tag must match PluginVersion in WTMouseAimPlugin.cs.
#
# ONE-TIME SETUP — the build compiles against the game's own assemblies, which are not
# redistributable and must never be committed to this (public) repo. Supply them privately:
#
#   1. Create a PRIVATE repo (default name: <you>/nuclear-option-refs) and copy the game's
#      whole  <game>\NuclearOption_Data\Managed\  folder into it, keeping that path:
#          NuclearOption_Data/Managed/Assembly-CSharp.dll
#          NuclearOption_Data/Managed/UnityEngine.dll   ... etc.
#      Re-copy after a game update that changes the code the mod hooks.
#   2. Create a fine-grained personal access token with read-only "Contents" access to that
#      one private repo, and save it in THIS repo as the Actions secret  GAME_REFS_TOKEN.
#   3. (Only if the private repo has a different name) set the Actions variable
#      GAME_REFS_REPO to  owner/name.
#
# BepInEx's own reference DLLs are downloaded by build/locate-game.ps1, as in a local build.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GAME_REFS_REPO: ${{ vars.GAME_REFS_REPO || format('{0}/nuclear-option-refs', github.repository_owner) }}
      HAS_REFS_TOKEN: ${{ secrets.GAME_REFS_TOKEN != '' }}
    steps:
      - name: Check setup
        shell: pwsh
        run: |
          if ($env:HAS_REFS_TOKEN -ne 'true') {
            Write-Error "Secret GAME_REFS_TOKEN is not set. See the setup notes at the top of .github/workflows/release.yml."
            exit 1
          }

      - uses: actions/checkout@v4

      - name: Fetch private game reference assemblies
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAME_REFS_REPO }}
          token: ${{ secrets.GAME_REFS_TOKEN }}
          path: .game

      - name: Prepare game folder
        shell: pwsh
        run: |
          $managed = '.game/NuclearOption_Data/Managed'
          if (-not (Test-Path "$managed/Assembly-CSharp.dll")) {
            Write-Error "$env:GAME_REFS_REPO must contain NuclearOption_Data/Managed/Assembly-CSharp.dll (copy the game's whole Managed folder)."
            exit 1
          }
          # build/locate-game.ps1 recognises a game folder by this file; an empty stand-in is enough.
          New-Item -ItemType File -Force -Path '.game/NuclearOption.exe' | Out-Null

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path WTMouseAimPlugin.cs -Pattern 'PluginVersion\s*=\s*"([^"]+)"'
          if (-not $m) { Write-Error 'PluginVersion not found in WTMouseAimPlugin.cs'; exit 1 }
          $v = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match PluginVersion $v (expected v$v)."
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check ARCHITECTURE.md is current
        run: python debugtests/check-architecture.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: dotnet build NuclearOption-MouseAim.csproj -c Release "/p:GamePath=$((Resolve-Path .game).Path)"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/WTMouseAim | Out-Null
          Copy-Item bin/Release/NuclearOption-MouseAim.dll dist/
          Copy-Item bin/Release/NuclearOption-MouseAim.dll dist/WTMouseAim/
          Compress-Archive -Path dist/WTMouseAim -DestinationPath "dist/WTMouseAim-v${{ steps.ver.outputs.version }}.zip" -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $tag = "v$v"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/NuclearOption-MouseAim.dll "dist/WTMouseAim-$tag.zip" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist/NuclearOption-MouseAim.dll "dist/WTMouseAim-$tag.zip" `
              --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WT Mouse Aim $tag" `
              --notes "Built from $env:GITHUB_SHA. See CHANGELOG.md for what changed. Drop NuclearOption-MouseAim.dll into BepInEx/plugins/WTMouseAim/ (or extract the zip into BepInEx/plugins/)."
          }
          exit $LASTEXITCODE
